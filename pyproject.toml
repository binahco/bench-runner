[project]
name = "bench-runner"
version = "0.1.0"
description = "En desarrollo LLM, los tests son datasets: y su filón nace evaluado."
requires-python = ">=3.12"
dependencies = [
    "llm-dev-core",
    "PyYAML>=6.0,<7",
]

[tool.uv.sources]
llm-dev-core = { path = "../llm-dev-core", editable = true }

[project.scripts]
bench-runner = "bench_runner.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bench_runner"]

[dependency-groups]
dev = ["pytest>=8,<9"]